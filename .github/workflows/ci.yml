name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: web_platform_test
        ports: ['55432:5432']
        options: >-
          --health-cmd 'pg_isready -U test -d web_platform_test'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JWT_ACCESS_SECRET: ci-only-disposable-signing-key-12345678901234567890
      NEXT_TELEMETRY_DISABLED: '1'
      TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:55432/web_platform_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:integration
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait
      - name: Check the deployed frontend and database-backed API
        run: node scripts/smoke-stack.mjs
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
