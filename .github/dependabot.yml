version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      nest:
        patterns: ['@nestjs/*', 'nestjs-zod']
      react:
        patterns: ['react', 'react-dom', '@types/react*', 'next']
      lint:
        patterns: ['eslint*', '@eslint/*', '*typescript-eslint*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
